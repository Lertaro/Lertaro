# Builds, signs and publishes a release when a version tag is pushed.
#
# Mirrors the GitHub Actions workflow this project used to publish with. The structural difference is
# forced by GitLab: release assets can only be created by CI, so the artifacts go into the generic
# package registry and the release itself carries links to them.
#
# The updater downloads a portable zip and then "<zip url>.sig" (see UpdateInstaller), so every signature
# is published as an asset named "<zip>.sig" beside the zip: appending ".sig" to the zip's direct asset
# URL resolves to it. Keep those names in step with UpdateAssetSelector.
#
# Builds on a self-hosted Windows runner tagged `windows` -- this developer's own machine, C:\gitlab-runner,
# started with `gitlab-runner run -c config.toml` rather than installed as a service. Jobs therefore stay
# pending until that machine is logged in and the runner is up: start it before pushing the tag. Running as
# the signed-in user is deliberate, because Inno Setup 7 is installed per-user (%LOCALAPPDATA%) and winget,
# which the build job falls back on, is not usable from LocalSystem. GitLab.com's hosted Windows runner
# (tag `saas-windows-medium-amd64`, free tier, beta) is the alternative if a machine-less build is wanted.

workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+/

stages:
  - build
  - release

variables:
  # The release job builds its changelog with git log / git describe, which need the full history and
  # the previous tags rather than the default shallow clone.
  GIT_DEPTH: "0"
  # Namespace for the artifacts in the generic package registry.
  PACKAGE_NAME: lertaro
  # How many recent versions' packages survive the post-release prune. See the end of the release job.
  KEEP_PACKAGE_VERSIONS: "3"
  # Uploaded and linked in this order; the x64 zip comes first so the release page leads with it.
  ARTIFACTS: Lertaro-Setup.exe Lertaro-Portable.zip Lertaro-Portable.zip.sig Lertaro-Setup-arm64.exe Lertaro-Portable-arm64.zip Lertaro-Portable-arm64.zip.sig

build:
  stage: build
  tags:
    - windows
  script:
    - |
      $ErrorActionPreference = 'Stop'
      [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

      # An unsigned release is one the updater refuses to install, so fail before spending a build on it.
      # LERTARO_SIGNING_KEY is the key file as ONE base64 line, which is exactly what make.bat decodes, so
      # the CI variable is a plain Variable rather than a File one (a File variable hands over a path).
      # A Protected variable is withheld from a pipeline whose ref is not protected, which looks like "not set".
      if (-not $env:LERTARO_SIGNING_KEY) {
        throw 'The LERTARO_SIGNING_KEY CI/CD variable is not set (a Protected variable is hidden from pipelines on unprotected tags); refusing to publish an unsigned release.'
      }
      # Decoding is make.bat's job; doing it here would leave two places that know the format. Validating the
      # shape is not, because finding out after a full two-architecture build wastes the whole run.
      $decoded = try { [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String(($env:LERTARO_SIGNING_KEY -replace '\s', ''))) } catch { $null }
      if (-not $decoded -or $decoded -notmatch '-----BEGIN') {
        throw 'LERTARO_SIGNING_KEY is not the key file as one base64 line; a File-type variable gives a path instead of the content.'
      }

      if (-not (Test-Path 'C:\Program Files\Inno Setup 7\ISCC.exe') -and
          -not (Test-Path "$env:LOCALAPPDATA\Programs\Inno Setup 7\ISCC.exe")) {
        winget install JRSoftware.InnoSetup.7 --force --silent --no-upgrade --accept-source-agreements
      }

      .\make.bat
      if ($LASTEXITCODE -ne 0) { throw "make.bat failed with exit code $LASTEXITCODE" }

      foreach ($name in $env:ARTIFACTS.Split(' ')) {
        if (-not (Test-Path "dist/$name")) { throw "Missing release artifact: dist/$name" }
      }
      foreach ($zip in @('Lertaro-Portable.zip', 'Lertaro-Portable-arm64.zip')) {
        if ((Get-Item "dist/$zip.sig").Length -lt 8) { throw "Empty signature: dist/$zip.sig" }
      }
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

release:
  stage: release
  tags:
    - windows
  needs:
    - job: build
      artifacts: true
  script:
    - |
      $ErrorActionPreference = 'Stop'
      [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

      $tag = $env:CI_COMMIT_TAG
      $files = $env:ARTIFACTS.Split(' ')

      # Changelog: commits since the previous tag, as the GitHub workflow wrote it.
      $previous = git describe --tags --abbrev=0 "$tag^" 2>$null
      $range = if ($LASTEXITCODE -eq 0 -and $previous) { "$previous..$tag" } else { $tag }
      $commits = (git log --pretty=format:"* %s (%h)" --no-merges $range) -join "`n"

      $lines = [System.Collections.Generic.List[string]]::new()
      $lines.Add('## Changelog (Commits)')
      $lines.Add('')
      $lines.Add($commits)
      $lines.Add('')
      $lines.Add('## Security Verification')
      $lines.Add('')
      $lines.Add('### SHA-256 Checksums')
      foreach ($name in $files) {
        $hash = (Get-FileHash -Path "dist/$name" -Algorithm SHA256).Hash.ToLower()
        $lines.Add("* **$name**: ``$hash``")
      }

      # The public key is read out of the source so the notes cannot drift from what the app trusts.
      $source = Get-Content 'Core/Services/Update/UpdatePackage.cs' -Raw
      $parts = [regex]::Matches($source, '"([A-Za-z0-9+/=]{40,})\\n"') | ForEach-Object { $_.Groups[1].Value }
      if ($parts) {
        $lines.Add('')
        $lines.Add('### Signature Verification (ECDsa NistP256)')
        $lines.Add('The portable zips are signed with the release key. Save the public key below as')
        $lines.Add('`public_key.pem`, then run:')
        $lines.Add('')
        $lines.Add('```bash')
        $lines.Add('openssl dgst -sha256 -verify public_key.pem -signature Lertaro-Portable.zip.sig Lertaro-Portable.zip')
        $lines.Add('# Expected output: Verified OK')
        $lines.Add('```')
        $lines.Add('')
        $lines.Add('```')
        $lines.Add('-----BEGIN PUBLIC KEY-----')
        foreach ($part in $parts) { $lines.Add($part) }
        $lines.Add('-----END PUBLIC KEY-----')
        $lines.Add('```')
      }

      # 1. Publish the artifacts, then 2. link them from the release.
      $base = "$env:CI_API_V4_URL/projects/$env:CI_PROJECT_ID/packages/generic/$env:PACKAGE_NAME/$tag"
      $headers = @{ 'JOB-TOKEN' = $env:CI_JOB_TOKEN }
      foreach ($name in $files) {
        Write-Host "Uploading $name"
        Invoke-RestMethod -Method Put -Uri "$base/$name" -Headers $headers -InFile "dist/$name"
      }

      $links = @()
      foreach ($name in $files) {
        $links += @{
          name              = $name
          url               = "$base/$name"
          direct_asset_path = "/$name"
          link_type         = 'other'
        }
      }
      $releases = "$env:CI_API_V4_URL/projects/$env:CI_PROJECT_ID/releases"
      $existing = $null
      try { $existing = Invoke-RestMethod -Uri "$releases/$tag" -Headers $headers } catch { }

      $payload = @{
        name        = $tag
        description = ($lines -join "`n")
        assets      = @{ links = $links }
      }
      # tag_name is only accepted when creating a release; the update endpoint takes it from the URL.
      if (-not $existing) { $payload['tag_name'] = $tag }
      $body = [System.Text.Encoding]::UTF8.GetBytes(($payload | ConvertTo-Json -Depth 10))

      if ($existing) {
        Invoke-RestMethod -Method Put -Uri "$releases/$tag" -Headers $headers `
          -ContentType 'application/json; charset=utf-8' -Body $body
      } else {
        Invoke-RestMethod -Method Post -Uri $releases -Headers $headers `
          -ContentType 'application/json; charset=utf-8' -Body $body
      }
      Write-Host "Release $tag published."

      # Generic packages never expire, so every release would otherwise leave ~29 MB of installers and zips
      # behind in the project's storage forever. Delete every version older than the newest
      # KEEP_PACKAGE_VERSIONS. Pruning last also means a failed upload cannot delete a good package: the
      # current version is already in the list by then, so it is what pushes the old ones out of the window.
      $pruneAuth = if ($env:PACKAGE_TOKEN) { @{ 'PRIVATE-TOKEN' = $env:PACKAGE_TOKEN } } else { @{ 'JOB-TOKEN' = $env:CI_JOB_TOKEN } }
      $packageList = @(Invoke-RestMethod -Uri "$env:CI_API_V4_URL/projects/$env:CI_PROJECT_ID/packages?per_page=100&order_by=created_at&sort=desc" -Headers $pruneAuth)
      # ponytail: only the 100 newest packages are considered (6 per release, so ~16 releases of history).
      # Every release prunes, so the backlog never grows past one page. Raise per_page if that stops holding.
      $staleVersions = @($packageList | ForEach-Object { $_.version } | Select-Object -Unique |
        Select-Object -Skip ([int]$env:KEEP_PACKAGE_VERSIONS)) | Where-Object { $_ -ne $tag }
      $pruned = 0
      foreach ($version in $staleVersions) {
        foreach ($id in @($packageList | Where-Object { $_.version -eq $version } | ForEach-Object { $_.id })) {
          try {
            Invoke-RestMethod -Method Delete -Uri "$env:CI_API_V4_URL/projects/$env:CI_PROJECT_ID/packages/$id" -Headers $pruneAuth | Out-Null
            $pruned++
          } catch {
            # Losing storage is not worth failing a published release over, but a 403 here is actionable:
            # the job token has no delete permission, so set PACKAGE_TOKEN to a project access token (api).
            Write-Host "Prune of package $id ($version) refused: $($_.Exception.Message)"
          }
        }
      }
      Write-Host ("Pruned {0} old package file(s), kept the newest {1} version(s)." -f $pruned, $env:KEEP_PACKAGE_VERSIONS)
