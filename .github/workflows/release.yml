name: Build and Release

on:
  push:
    tags:
      - 'v*'
  # A manual run bypasses the release throttle below: start it on the tag to publish.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Releases go out at most once every 36 hours. A tag pushed sooner than that is ignored rather than
  # failed, so a burst of version bumps does not produce a burst of releases.
  release-guard:
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
    steps:
      - name: Check release interval
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REPO: ${{ github.repository }}
          MIN_HOURS: '36'
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "push" ]; then
            if [ "${REF#refs/tags/}" = "$REF" ]; then
              echo "::error::A manual release run needs a tag ref, got $REF."
              exit 1
            fi
            echo "Manual run of $REF: release throttle skipped."
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          published=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$REPO/releases/latest" | jq -r '.published_at // empty' || true)
          if [ -z "$published" ]; then
            echo "No previous release: allowed."
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          elapsed=$(( ($(date -u +%s) - $(date -d "$published" +%s)) / 3600 ))
          if [ "$elapsed" -lt "$MIN_HOURS" ]; then
            echo "::notice::Release throttled: the previous release was ${elapsed}h ago, the minimum is ${MIN_HOURS}h. Push the tag again later, or run this workflow manually to override."
            echo "allowed=false" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          fi

  build-and-release:
    needs: release-guard
    if: needs.release-guard.outputs.allowed == 'true'
    runs-on: windows-latest

    steps:
      # 1. Checkout codebase with full history to retrieve previous tags/commits
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 2. Configure .NET SDK
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # 3. Install Inno Setup 7, required for the 64-bit x64 Setup shell
      - name: Install Inno Setup
        run: |
          winget install JRSoftware.InnoSetup.7 --force --silent --no-upgrade --accept-source-agreements

      # 4. Hand the release key to make.bat, which signs the portable zips as part of packaging
      - name: Configure Signing Key
        shell: pwsh
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if (-not $env:SIGNING_KEY) {
              Write-Host "::warning::SIGNING_KEY is not configured; the portable zips will not be signed."
              exit 0
          }
          $keyPath = Join-Path $env:RUNNER_TEMP 'lertaro-release.key'
          [System.IO.File]::WriteAllText($keyPath, $env:SIGNING_KEY)
          "LERTARO_SIGNING_KEY=$keyPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # 5. Execute the build and package batch script
      - name: Run Build and Package Script
        run: |
          .\make.bat

      - name: Remove Signing Key
        if: always()
        shell: pwsh
        run: |
          $keyPath = Join-Path $env:RUNNER_TEMP 'lertaro-release.key'
          if (Test-Path $keyPath) { Remove-Item -Force $keyPath }

      # 6. Extract commit history since the previous tag as Release Notes
      - name: Generate Changelog
        id: changelog
        shell: bash
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "${{ github.ref_name }}^" 2>/dev/null || echo "")
          echo "## Changelog (Commits)" > changelog.md
          echo "" >> changelog.md
          if [ -z "$PREV_TAG" ]; then
            git log --pretty=format:"* %s (%h)" --no-merges >> changelog.md
          else
            git log --pretty=format:"* %s (%h)" --no-merges "$PREV_TAG..${{ github.ref_name }}" >> changelog.md
          fi
          echo "" >> changelog.md

      # 7. Hash checksums and the verification instructions. The public key is read out of the source so
      # the notes cannot drift from what the app actually trusts.
      - name: Add Verification Info
        shell: pwsh
        run: |
          $files = @('Lertaro-Setup.exe', 'Lertaro-Portable.zip', 'Lertaro-Setup-arm64.exe', 'Lertaro-Portable-arm64.zip')
          $lines = [System.Collections.Generic.List[string]]::new()
          $lines.Add('')
          $lines.Add('## Security Verification')
          $lines.Add('')
          $lines.Add('### SHA-256 Checksums')
          foreach ($name in $files) {
              $hash = (Get-FileHash -Path "dist/$name" -Algorithm SHA256).Hash.ToLower()
              $lines.Add("* **$name**: ``$hash``")
          }

          # make.bat signs during packaging; without SIGNING_KEY it leaves the zips unsigned and this fills
          # in the placeholders the upload step expects.
          $signed = $true
          foreach ($zip in @('Lertaro-Portable.zip', 'Lertaro-Portable-arm64.zip')) {
              $sig = "dist/$zip.sig"
              if (-not (Test-Path $sig) -or (Get-Item $sig).Length -lt 8) {
                  Set-Content -Path $sig -Value 'unsigned' -NoNewline
                  $signed = $false
              }
          }

          $source = Get-Content 'Core/Services/Update/UpdatePackage.cs' -Raw
          $parts = [regex]::Matches($source, '"([A-Za-z0-9+/=]{40,})\\n"') | ForEach-Object { $_.Groups[1].Value }

          if ($signed -and $parts) {
              $lines.Add('')
              $lines.Add('### Signature Verification (ECDsa NistP256)')
              $lines.Add('The portable zips are signed with the release key. Save the public key below as')
              $lines.Add('`public_key.pem`, then run:')
              $lines.Add('')
              $lines.Add('```bash')
              $lines.Add('openssl dgst -sha256 -verify public_key.pem -signature Lertaro-Portable.zip.sig Lertaro-Portable.zip')
              $lines.Add('# Expected output: Verified OK')
              $lines.Add('```')
              $lines.Add('')
              $lines.Add('```')
              $lines.Add('-----BEGIN PUBLIC KEY-----')
              foreach ($part in $parts) { $lines.Add($part) }
              $lines.Add('-----END PUBLIC KEY-----')
              $lines.Add('```')
          } elseif (-not $signed) {
              $lines.Add('')
              $lines.Add('*Note: this release is unsigned (SIGNING_KEY missing).*')
          }

          $lines | Add-Content -Path changelog.md -Encoding utf8

      # 8. Publish release and upload artifacts (installers, portable ZIPs, and signatures)
      # The new repository is not visible to legacy installs, so ARM64 assets use the conventional
      # hyphenated suffix. Keep these names in sync with make.bat and UpdateAssetSelector.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: changelog.md
          files: |
            dist/Lertaro-Setup.exe
            dist/Lertaro-Portable.zip
            dist/Lertaro-Portable.zip.sig
            dist/Lertaro-Setup-arm64.exe
            dist/Lertaro-Portable-arm64.zip
            dist/Lertaro-Portable-arm64.zip.sig
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
